server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API access, mirroring the Vite dev proxy.
    location /api/ {
        proxy_pass http://order-service:8080;
        # nginx speaks HTTP/1.0 upstream by default; Kestrel rejects a bodyless POST without Content-Length over it.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
